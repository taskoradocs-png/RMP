
name: RouterManager Pro - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RouterManager Pro
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q routermanager-pro.zip -d project

          SETTINGS=$(find project -name settings.gradle.kts -type f | head -n 1)
          test -n "$SETTINGS"

          PROJECT_ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/gradle/libs.versions.toml"

      - name: Fix KSP CI compatibility
        shell: bash
        run: |
          set -euo pipefail
          FILE="$PROJECT_ROOT/gradle/libs.versions.toml"

          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.3.6"/' "$FILE"

          grep 'googleDevtoolsKsp' "$FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RouterManagerPro-debug-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
